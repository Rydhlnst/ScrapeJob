name: ${COMPOSE_PROJECT_NAME:-scrapejob}

x-backend-env: &backend-env
  APP_NAME: ${APP_NAME:-Job Loker API}
  APP_ENV: ${APP_ENV:-production}
  APP_KEY: ${APP_KEY:?APP_KEY is required}
  APP_DEBUG: ${APP_DEBUG:-false}
  APP_URL: ${APP_URL:?APP_URL is required}
  FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required}
  APP_LOCALE: ${APP_LOCALE:-en}
  APP_FALLBACK_LOCALE: ${APP_FALLBACK_LOCALE:-en}
  APP_FAKER_LOCALE: ${APP_FAKER_LOCALE:-en_US}
  LOG_CHANNEL: ${LOG_CHANNEL:-stack}
  LOG_STACK: ${LOG_STACK:-single}
  LOG_LEVEL: ${LOG_LEVEL:-warning}
  BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
  CACHE_STORE: ${CACHE_STORE:-database}
  QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
  DB_QUEUE_TABLE: ${DB_QUEUE_TABLE:-queue_jobs}
  SESSION_DRIVER: ${SESSION_DRIVER:-database}
  SESSION_LIFETIME: ${SESSION_LIFETIME:-120}
  SESSION_ENCRYPT: ${SESSION_ENCRYPT:-false}
  SESSION_PATH: ${SESSION_PATH:-/}
  SESSION_DOMAIN: ${SESSION_DOMAIN:-}
  SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:?SANCTUM_STATEFUL_DOMAINS is required}
  DB_CONNECTION: ${DB_CONNECTION:-pgsql}
  DB_HOST: ${DB_HOST:-db}
  DB_PORT: ${DB_PORT:-5432}
  DB_DATABASE: ${DB_DATABASE:?DB_DATABASE is required}
  DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
  DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
  REDIS_CLIENT: ${REDIS_CLIENT:-phpredis}
  REDIS_HOST: ${REDIS_HOST:-redis}
  REDIS_PORT: ${REDIS_PORT:-6379}
  REDIS_PASSWORD: ${REDIS_PASSWORD:-null}
  MAIL_MAILER: ${MAIL_MAILER:-log}
  MAIL_SCHEME: ${MAIL_SCHEME:-null}
  MAIL_HOST: ${MAIL_HOST:-smtp.example.com}
  MAIL_PORT: ${MAIL_PORT:-2525}
  MAIL_USERNAME: ${MAIL_USERNAME:-null}
  MAIL_PASSWORD: ${MAIL_PASSWORD:-null}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-hello@example.com}
  MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Job Loker API}
  SCRAPER_ACTIVE_SOURCES: ${SCRAPER_ACTIVE_SOURCES:-glints,jobstreet}
  SCRAPER_SCHEDULE_ENABLED: ${SCRAPER_SCHEDULE_ENABLED:-true}
  SCRAPER_SCHEDULE_CRON: ${SCRAPER_SCHEDULE_CRON:-0 */8 * * *}
  SCRAPER_SCHEDULE_TIMEZONE: ${SCRAPER_SCHEDULE_TIMEZONE:-Asia/Jakarta}
  SCRAPER_SCHEDULE_WITHOUT_OVERLAPPING_MINUTES: ${SCRAPER_SCHEDULE_WITHOUT_OVERLAPPING_MINUTES:-480}
  SCRAPER_NOTIFY_EMAILS: ${SCRAPER_NOTIFY_EMAILS:-}
  GLINTS_KEYWORDS: ${GLINTS_KEYWORDS:-software engineer,backend,frontend}
  GLINTS_COUNTRIES: ${GLINTS_COUNTRIES:-ID}
  JOBSTREET_KEYWORDS: ${JOBSTREET_KEYWORDS:-software,developer,engineer}
  SCRAPER_INTERNAL_API_TOKEN: ${SCRAPER_INTERNAL_API_TOKEN:?SCRAPER_INTERNAL_API_TOKEN is required}
  SCRAPER_PYTHON_MODE: ${SCRAPER_PYTHON_MODE:-local}
  SCRAPER_PYTHON_BIN: ${SCRAPER_PYTHON_BIN:-python3}
  NODE_PATH: ${NODE_PATH:-node}
  PUPPETEER_TIMEOUT: ${PUPPETEER_TIMEOUT:-120}
  WAIT_FOR_DB: "true"
  ENABLE_LARAVEL_CACHE_WARMUP: "true"
  RUN_MIGRATIONS: "false"
  AI_CLEANUP_ENABLED: ${AI_CLEANUP_ENABLED:-true}
  AI_CLEANUP_URL: ${AI_CLEANUP_URL:-http://frontend:3000/api/internal/clean-job}

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:?NEXT_PUBLIC_API_BASE_URL is required}
        INTERNAL_API_BASE_URL: ${INTERNAL_API_BASE_URL:-http://backend}
        NEXT_PUBLIC_USE_MOCK: ${NEXT_PUBLIC_USE_MOCK:-false}
        API_BEARER_TOKEN: ${API_BEARER_TOKEN:-}
        DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
        SCRAPER_INTERNAL_API_TOKEN: ${SCRAPER_INTERNAL_API_TOKEN:-}
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:?NEXT_PUBLIC_API_BASE_URL is required}
      INTERNAL_API_BASE_URL: ${INTERNAL_API_BASE_URL:-http://backend}
      NEXT_PUBLIC_USE_MOCK: ${NEXT_PUBLIC_USE_MOCK:-false}
      API_BEARER_TOKEN: ${API_BEARER_TOKEN:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      SCRAPER_INTERNAL_API_TOKEN: ${SCRAPER_INTERNAL_API_TOKEN:-}
      AI_PROVIDER: ${AI_PROVIDER:-deepseek}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      <<: *backend-env
    ports:
      - "${BACKEND_PORT:-8000}:80"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/api/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  queue:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      <<: *backend-env
      QUEUE_TRIES: ${QUEUE_TRIES:-3}
      QUEUE_TIMEOUT: ${QUEUE_TIMEOUT:-900}
    command: ["/var/www/html/docker/start-worker.sh"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      <<: *backend-env
    command: ["/var/www/html/docker/start-scheduler.sh"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped

  scraper:
    build:
      context: ./scraper-service
      dockerfile: Dockerfile
    image: scrapejob-scraper:production
    environment:
      LOG_LEVEL: ${SCRAPER_LOG_LEVEL:-INFO}
      SAVE_JSON: ${SCRAPER_SAVE_JSON:-false}
      SEND_TO_LARAVEL: ${SCRAPER_SEND_TO_LARAVEL:-true}
      LARAVEL_API_BASE_URL: ${LARAVEL_API_BASE_URL:-http://backend/api}
      LARAVEL_IMPORT_PATH: ${LARAVEL_IMPORT_PATH:-/internal/scraped-jobs/import}
      LARAVEL_INTERNAL_API_TOKEN: ${SCRAPER_INTERNAL_API_TOKEN:?SCRAPER_INTERNAL_API_TOKEN is required}
    depends_on:
      backend:
        condition: service_healthy
    restart: "no"
    profiles:
      - scraper

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    volumes:
      - pg-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    volumes:
      - redis-data:/data

volumes:
  pg-data:
  redis-data:
