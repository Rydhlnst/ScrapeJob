services:
  frontend:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - ./.env.local
    depends_on:
      - backend

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      - db
      - redis

  scraper:
    build: ./scraper-service
    image: scrapejob-scraper:local
    env_file:
      - ./scraper-service/.env
    depends_on:
      - backend
    profiles:
      - scraper

  db:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: job_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - pg-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  pg-data:
