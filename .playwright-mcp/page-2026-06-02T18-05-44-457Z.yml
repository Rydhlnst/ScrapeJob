                  - paragraph [ref=e256]: "Job Requirement : • Having work experience as Rotating Equipment Engineer is preferred • Having work experience to repair centrifugal pump, steam turbines is preferred • Graduate of an engineering curriculum with degree and specialized training and experience in turbomachinery and related disciplines that provides technical qualification for assigned function. • Knowledge of CAD, 3D CAD, CREO is preferable. • Demonstrated effective judgment and independence of action. • Knowledge of company policies, markets, organization structure and procedures. • Minimum applicable engineering experience level five (5) years. Job Description : • Plans, budgets, schedules and performs engineering assignments toward specified objectives within allocated time, schedule, cost and constraint established by supervision. • Independently initiates, develops, applies and test designs for new repair opportunity, special application /systems and existing products/systems improvements. • Independently plans, prepares and executes experimental program for the development of new or existing repair opportunity, design procedures. method or systems and issue applicable documentation, • Initiates changes to existing component designs and repair methods as required for shop orders product improvements, manufacturing considerations and field modifications • Responsible for planning, organizing and completion of major elements of the technical plan. • Provides participative direction to those performing the assignment in the calculation and analysis of data and final reporting, • Provides technical information, co-ordinates and follows up in intra/inter- departmental activities to insure conformance to design and quality standards. • Approves layouts and drawings for assigned projects, issues appropriate documentation and informs supervision of activity status. • Provides specialized technical support/information to Sales and Service as assigned. • Provides innovation and original ideas. • Maintains awareness to new and state-of-the-art technology, competitive intelligence and new turbomachinery applications/user requirements. • Administers capital and inter-departmental programs as assigned by supervision. • Maintains knowledge of company objectives and technical plan as applied to assignment and related products/systems/functions. • Promotes, implements and reflects productivity and quality ideas as relates to assigned function. • Pursues a personal career development plan prepared in conjunction with supervision. • Performs other duties as assigned by supervision. • Performs planning and technical detailing for field service jobs in order to establish the service work requirements to be performed • Establishes quality and documentation requirements for repair jobs"
