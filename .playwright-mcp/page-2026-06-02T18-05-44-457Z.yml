                - generic [ref=e155]:
                  - paragraph [ref=e156]: "Company Description : We are one of the top 10 biggest banks in terms of assets in Indonesia and listed in the Indonesia Stock Exchange. Permata Bank is a KBMI 3 with a strong core capital of nearly 50 trillion rupiahs. We believe that our employees are our greatest asset, and we are deeply committed to creating an environment where they can Learn, Grow, and Make a difference. This commitment is reflected in the recognition we've received-HR Excellent Award 2024 in the Learning Development and Knowledge Management categories. In addition, we achieve a net profit of over 2 trillions rupiahs in 2024, further solidifying our position as a leading financial institution. Why PermataBank ? Here at PermataBank, you will Learn, Grow, and Make A Difference, You will have the appetite and the ability to learn many things, challenged to grow beyond ways you can imagine, and see the incredible difference you would have made along the journey. This is our platform for you. We cannot promise a smooth ride, but rest assured, it is going to be a meaningful journey! Learn : We always think innovatively to improve the way we work, making it easier, better and faster. Grow : We provide excellent service to customers and encourage excellent performance in our daily work. Make a difference : We understand each other and together build strong relationships with internal and external parties based on mutual respect. Key Responsibilities Lead and grow the data engineering team Design and manage scalable data pipelines (ETL/ELT) Oversee data warehouse and data lake platforms Ensure data quality, reliability, and performance Implement data governance, lineage, and security Collaborate with BI, Analytics, IT, and business teams Requirements 5+ years of experience in data engineering / data platforms Proven experience managing large-scale data environments (banking is a plus) Strong knowledge of ETL/ELT tools (Informatica, Talend, DataStage, Airflow) Solid experience with SQL Server, Oracle, and data warehousing Familiar with big data technologies, Git, and CI/CD Strong leadership, communication, and problem-solving skills Directorates : Technology PT Bank Permata Tbk hereby informs that the company does not impose any charges in the employee recruitment process."
