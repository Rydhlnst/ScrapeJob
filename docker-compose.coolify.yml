# Shared Laravel environment for backend / workers / scheduler.
# Single source of truth — edit here once, applies to all three services.
x-laravel-env: &laravel-env
  APP_NAME: ${APP_NAME:-Job Loker API}
  APP_ENV: production
  APP_KEY: ${APP_KEY}
  APP_DEBUG: "false"
  APP_URL: https://${SERVICE_FQDN_BACKEND:?SERVICE_FQDN_BACKEND is required}
  FRONTEND_URL: https://${SERVICE_FQDN_FRONTEND:?SERVICE_FQDN_FRONTEND is required}
  DB_CONNECTION: pgsql
  DB_HOST: db
  DB_PORT: 5432
  DB_DATABASE: ${POSTGRES_DB:-job_platform}
  DB_USERNAME: ${POSTGRES_USER:-postgres}
  DB_PASSWORD: ${POSTGRES_PASSWORD}
  REDIS_CLIENT: phpredis
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  SESSION_DRIVER: ${SESSION_DRIVER:-database}
  SESSION_DOMAIN: ${SESSION_DOMAIN:-.beres.io}
  SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-scrape.beres.io,www.scrape.beres.io}
  CACHE_STORE: ${CACHE_STORE:-database}
  QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
  SCRAPER_ACTIVE_SOURCES: ${SCRAPER_ACTIVE_SOURCES:-glints,jobstreet,jobstreetexpress,kalibrr,lokerid}
  SCRAPER_SCHEDULE_ENABLED: "true"
  SCRAPER_SCHEDULE_CRON: ${SCRAPER_SCHEDULE_CRON:-0 */8 * * *}
  SCRAPER_SCHEDULE_TIMEZONE: ${SCRAPER_SCHEDULE_TIMEZONE:-Asia/Jakarta}
  SCRAPER_INTERNAL_API_TOKEN: ${SCRAPER_INTERNAL_API_TOKEN}
  SCRAPER_PYTHON_TIMEOUT_SECONDS: ${SCRAPER_PYTHON_TIMEOUT_SECONDS:-600}
  SCRAPER_AUTO_CREATE_DRAFTS: ${SCRAPER_AUTO_CREATE_DRAFTS:-true}
  SCRAPER_RUN_ON_STARTUP: ${SCRAPER_RUN_ON_STARTUP:-true}
  SCRAPER_PYTHON_MODE: local
  SCRAPER_PYTHON_BIN: python3
  REQUEST_DELAY_MIN: ${REQUEST_DELAY_MIN:-0.5}
  REQUEST_DELAY_MAX: ${REQUEST_DELAY_MAX:-1}
  HTTP_RETRIES: ${HTTP_RETRIES:-3}
  SCRAPE_ATTEMPTS: ${SCRAPE_ATTEMPTS:-2}
  FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
  FIRECRAWL_API_URL: ${FIRECRAWL_API_URL:-https://api.firecrawl.dev}
  WAIT_FOR_DB: "true"
  AI_CLEANUP_ENABLED: ${AI_CLEANUP_ENABLED:-false}
  AI_CLEANUP_URL: ${AI_CLEANUP_URL:-http://frontend:3000/api/internal/clean-job}
  LOG_CHANNEL: ${LOG_CHANNEL:-stack}
  LOG_LEVEL: ${LOG_LEVEL:-warning}
  ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@beres.io}
  ADMIN_NAME: "${ADMIN_NAME:-Super Admin}"
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}

services:
  migrate:
    image: scrapejob-backend:coolify
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      <<: *laravel-env
      RUN_MIGRATIONS: "false"
      ENABLE_LARAVEL_CACHE_WARMUP: "false"
    command: ["/var/www/html/docker/start-migrate.sh"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: https://${SERVICE_FQDN_BACKEND:?SERVICE_FQDN_BACKEND is required}
        NEXT_PUBLIC_USE_MOCK: ${NEXT_PUBLIC_USE_MOCK:-false}
    environment:
      NEXT_PUBLIC_API_BASE_URL: https://${SERVICE_FQDN_BACKEND:?SERVICE_FQDN_BACKEND is required}
      INTERNAL_API_BASE_URL: ${INTERNAL_API_BASE_URL:-http://backend}
      NEXT_PUBLIC_USE_MOCK: ${NEXT_PUBLIC_USE_MOCK:-false}
      CMS_ADMIN_DOMAIN: ${SERVICE_FQDN_FRONTEND:?SERVICE_FQDN_FRONTEND is required}
      API_BEARER_TOKEN: ${API_BEARER_TOKEN:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      SCRAPER_INTERNAL_API_TOKEN: ${SCRAPER_INTERNAL_API_TOKEN:-}
      AI_PROVIDER: ${AI_PROVIDER:-deepseek}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/logo.svg || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  backend:
    image: scrapejob-backend:coolify
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      <<: *laravel-env
      RUN_MIGRATIONS: "false"
      ENABLE_LARAVEL_CACHE_WARMUP: "true"
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@beres.io}
      ADMIN_NAME: "${ADMIN_NAME:-Super Admin}"
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/api/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  queue:
    image: scrapejob-backend:coolify
    user: www-data
    environment:
      <<: *laravel-env
      QUEUE_TRIES: ${QUEUE_TRIES:-3}
      QUEUE_TIMEOUT: ${QUEUE_TIMEOUT:-720}
      QUEUE_WORKERS: ${QUEUE_WORKERS:-3}
    command: ["/var/www/html/docker/start-worker.sh"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
    restart: unless-stopped

  ai-worker:
    image: scrapejob-backend:coolify
    user: www-data
    environment:
      <<: *laravel-env
      AI_QUEUE_TRIES: ${AI_QUEUE_TRIES:-3}
      AI_QUEUE_TIMEOUT: ${AI_QUEUE_TIMEOUT:-120}
    command: ["/var/www/html/docker/start-ai-worker.sh"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    image: scrapejob-backend:coolify
    user: www-data
    environment:
      <<: *laravel-env
    command: ["/var/www/html/docker/start-scheduler.sh"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-job_platform}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-job_platform}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    volumes:
      - pg-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    volumes:
      - redis-data:/data

volumes:
  pg-data:
  redis-data:
